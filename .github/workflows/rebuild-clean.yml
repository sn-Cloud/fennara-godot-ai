name: 临时重建验证

on:
  pull_request:
    branches:
      - main
    paths:
      - '.rebuild/**'
      - '.github/workflows/rebuild-clean.yml'

permissions:
  contents: write

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ok: ${{ steps.validate.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - id: validate
        name: Linux 验证（失败只记录，不发送失败通知）
        shell: bash
        env:
          CI: 'true'
        run: |
          set +e
          ok=true
          mkdir -p clean logs
          cat .rebuild/chunk_* | base64 -d > rebuild.tar.gz
          if [[ $? -ne 0 ]]; then ok=false; fi
          if [[ "$ok" == "true" ]]; then
            tar -xzf rebuild.tar.gz -C clean
            if [[ $? -ne 0 ]]; then ok=false; fi
          fi
          if [[ "$ok" == "true" ]]; then
            curl -L --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
            if [[ $? -ne 0 ]]; then ok=false; fi
          fi
          if [[ "$ok" == "true" ]]; then
            unzip -q godot.zip
            chmod +x Godot_v4.6.3-stable_linux.x86_64
            npm install -g @openai/codex @moonshot-ai/kimi-code@latest > logs/npm.log 2>&1
            if [[ $? -ne 0 ]]; then ok=false; fi
          fi
          if [[ "$ok" == "true" ]]; then
            codex --version | tee logs/codex-version.log
            if [[ ${PIPESTATUS[0]} -ne 0 ]]; then ok=false; fi
            kimi --version | tee logs/kimi-version.log
            if [[ ${PIPESTATUS[0]} -ne 0 ]]; then ok=false; fi
          fi
          if [[ "$ok" == "true" ]]; then
            mkdir -p clean/tests/godot_ai_manager/addons
            cp -R clean/addons/godot_ai_manager clean/tests/godot_ai_manager/addons/
            chmod +x clean/tests/godot_ai_manager/mock_codex.py clean/tests/godot_ai_manager/mock_kimi.py

            ./Godot_v4.6.3-stable_linux.x86_64 --headless --path clean/tests/godot_ai_manager --editor --quit-after 5 > logs/editor.log 2>&1
            if [[ $? -ne 0 ]]; then ok=false; fi

            ./Godot_v4.6.3-stable_linux.x86_64 --headless --path clean/tests/godot_ai_manager --script res://backend_smoke_test.gd > logs/backend.log 2>&1
            if [[ $? -ne 0 ]]; then ok=false; fi

            ./Godot_v4.6.3-stable_linux.x86_64 --headless --path clean/tests/godot_ai_manager --script res://official_cli_smoke_test.gd > logs/official.log 2>&1
            if [[ $? -ne 0 ]]; then ok=false; fi
          fi
          echo "$ok" > logs/result.txt
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 保存 Linux 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-linux-logs
          path: logs
          if-no-files-found: ignore

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      ok: ${{ steps.validate.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - id: validate
        name: Windows 验证（失败只记录，不发送失败通知）
        shell: pwsh
        env:
          CI: 'true'
        run: |
          $ok = $true
          New-Item -ItemType Directory -Force -Path clean, logs | Out-Null
          try {
            $parts = Get-ChildItem .rebuild/chunk_* | Sort-Object Name
            $builder = [System.Text.StringBuilder]::new()
            foreach ($part in $parts) {
              [void]$builder.Append([System.IO.File]::ReadAllText($part.FullName))
            }
            [System.IO.File]::WriteAllBytes("rebuild.tar.gz", [Convert]::FromBase64String($builder.ToString()))
            tar -xzf rebuild.tar.gz -C clean
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          }
          catch {
            $_ | Out-File logs/extract-error.log
            $ok = $false
          }

          if ($ok) {
            try {
              Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip" -OutFile godot.zip
              Expand-Archive godot.zip -DestinationPath . -Force
              npm install -g @openai/codex @moonshot-ai/kimi-code@latest *> logs/npm.log
              if ($LASTEXITCODE -ne 0) { $ok = $false }
            }
            catch {
              $_ | Out-File logs/install-error.log
              $ok = $false
            }
          }

          if ($ok) {
            codex --version *> logs/codex-version.log
            if ($LASTEXITCODE -ne 0) { $ok = $false }
            kimi --version *> logs/kimi-version.log
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          }

          if ($ok) {
            try {
              New-Item -ItemType Directory -Force -Path clean/tests/godot_ai_manager/addons | Out-Null
              Copy-Item -Recurse -Force clean/addons/godot_ai_manager clean/tests/godot_ai_manager/addons/

              & .\Godot_v4.6.3-stable_win64.exe --headless --path clean/tests/godot_ai_manager --editor --quit-after 5 *> logs/editor.log
              if ($LASTEXITCODE -ne 0) { $ok = $false }

              & .\Godot_v4.6.3-stable_win64.exe --headless --path clean/tests/godot_ai_manager --script res://backend_smoke_test.gd *> logs/backend.log
              if ($LASTEXITCODE -ne 0) { $ok = $false }

              & .\Godot_v4.6.3-stable_win64.exe --headless --path clean/tests/godot_ai_manager --script res://official_cli_smoke_test.gd *> logs/official.log
              if ($LASTEXITCODE -ne 0) { $ok = $false }
            }
            catch {
              $_ | Out-File logs/test-error.log
              $ok = $false
            }
          }

          $value = if ($ok) { "true" } else { "false" }
          $value | Out-File logs/result.txt
          "ok=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: 保存 Windows 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-windows-logs
          path: logs
          if-no-files-found: ignore

  publish-clean-tree:
    needs:
      - linux-test
      - windows-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/godot-codex-native-chat
          fetch-depth: 0

      - name: 仅在双平台全部通过后发布干净树
        shell: bash
        run: |
          set +e
          echo "Linux: ${{ needs.linux-test.outputs.ok }}"
          echo "Windows: ${{ needs.windows-test.outputs.ok }}"
          if [[ "${{ needs.linux-test.outputs.ok }}" != "true" || "${{ needs.windows-test.outputs.ok }}" != "true" ]]; then
            echo "测试未全部通过，分支保持临时状态，等待修复。"
            exit 0
          fi

          mkdir -p /tmp/clean-tree
          cat .rebuild/chunk_* | base64 -d > /tmp/rebuild.tar.gz || exit 0
          tar -xzf /tmp/rebuild.tar.gz -C /tmp/clean-tree || exit 0

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/clean-tree/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "重建为 Codex 与 Kimi 双官方后端" || exit 0
          git push origin HEAD:agent/godot-codex-native-chat || exit 0
          echo "干净最终树已发布。"
          exit 0
