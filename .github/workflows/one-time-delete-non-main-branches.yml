name: 一次性删除非 main 分支

on:
  push:
    branches:
      - main
    paths:
      - .github/one-time-delete-non-main-branches.trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 删除 main 之外的全部分支
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          echo "保留默认分支：${default_branch}"

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          deleted=()
          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "${default_branch}" ]]; then
              continue
            fi

            encoded_branch="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${branch}")"
            echo "删除分支：${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            deleted+=("${branch}")
          done

          if [[ ${#deleted[@]} -eq 0 ]]; then
            echo "没有需要删除的分支。"
            summary="无非默认分支"
          else
            printf '已删除分支：\n- %s\n' "${deleted[@]}"
            summary="$(IFS=', '; echo "${deleted[*]}")"
          fi

          echo "CLEANUP_SUMMARY=${summary}" >> "${GITHUB_ENV}"

      - name: 删除一次性清理文件
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/one-time-delete-non-main-branches.yml
          rm -f .github/one-time-delete-non-main-branches.trigger
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: remove one-time branch cleanup"
          git push origin HEAD:main
