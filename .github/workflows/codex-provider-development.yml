name: Codex Provider Development

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-provider-development
  cancel-in-progress: false

jobs:
  apply-phase-one:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/codex-embedded-provider
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply phase-one architecture changes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/    expected=2,/    expected=1,/' .github/scripts/apply_codex_provider_phase1.py
          python .github/scripts/apply_codex_provider_phase1.py
          python -c "from pathlib import Path; p=Path('local/crates/fennara-daemon/src/runtime_daemon/chat/providers/mod.rs'); s=p.read_text(encoding='utf-8'); n=chr(10); old='        max_output_tokens: None,'+n+'        cwd: None,'+n+'        approval_mode: \"ask\".to_string(),'; new='        max_output_tokens: None,'+n+'        chat_id: None,'+n+'        cwd: None,'+n+'        approval_mode: \"ask\".to_string(),'; count=s.count(old); assert count == 1, f'expected one remaining ChatRequest constructor, found {count}'; p.write_text(s.replace(old,new,1), encoding='utf-8', newline=n)"
          python .github/scripts/fix_codex_chat_id_initializers.py

      - name: Format Rust
        working-directory: local
        run: cargo fmt --all

      - name: Test daemon
        working-directory: local
        run: cargo test --locked -p fennara-daemon

      - name: Capture verified patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codex-phase-one-artifact
          git diff --binary > codex-phase-one-artifact/codex-phase-one.patch
          git status --short > codex-phase-one-artifact/status.txt

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: codex-phase-one-patch
          path: codex-phase-one-artifact/
          if-no-files-found: error

      - name: Remove one-time development files
        shell: bash
        run: |
          rm -f .github/scripts/apply_codex_provider_phase1.py
          rm -f .github/scripts/fix_codex_chat_id_initializers.py
          rm -f .github/workflows/codex-provider-development.yml
          rm -f .github/codex-provider-phase1.trigger

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(codex): persist and resume provider threads"
          git push origin HEAD:feature/codex-embedded-provider
