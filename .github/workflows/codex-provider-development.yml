name: Codex Provider Development

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-provider-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-phase-one:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/codex-embedded-provider' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/codex-embedded-provider
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply phase-one architecture changes
        run: python .github/scripts/apply_codex_provider_phase1.py

      - name: Format Rust
        working-directory: local
        run: cargo fmt --all

      - name: Test daemon
        working-directory: local
        run: cargo test --locked -p fennara-daemon

      - name: Capture verified patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codex-phase-one-artifact
          git diff --binary > codex-phase-one-artifact/codex-phase-one.patch
          git status --short > codex-phase-one-artifact/status.txt

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: codex-phase-one-patch
          path: codex-phase-one-artifact/
          if-no-files-found: error

      - name: Remove one-time development files
        shell: bash
        run: |
          rm -f .github/scripts/apply_codex_provider_phase1.py
          rm -f .github/workflows/codex-provider-development.yml
          rm -f .github/codex-provider-phase1.trigger

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(codex): persist and resume provider threads"
          git push origin HEAD:feature/codex-embedded-provider
