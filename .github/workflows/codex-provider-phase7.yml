name: Codex Provider Phase 7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codex-provider-phase7
  cancel-in-progress: false

jobs:
  windows-runtime:
    runs-on: windows-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/codex-embedded-provider
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply phase-seven changes
        run: python .github/scripts/apply_codex_provider_phase7.py

      - name: Format Rust
        working-directory: local
        run: cargo fmt --all

      - name: Test daemon on Windows
        working-directory: local
        run: cargo test --locked -p fennara-daemon

      - name: Remove one-time migration files
        shell: pwsh
        run: |
          Remove-Item .github/scripts/apply_codex_provider_phase7.py -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/codex-provider-phase7.yml -ErrorAction SilentlyContinue
          Remove-Item .github/codex-provider-phase7.trigger -ErrorAction SilentlyContinue

      - name: Commit verified changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(codex): launch Windows batch runtime correctly"
          git push origin HEAD:feature/codex-embedded-provider
