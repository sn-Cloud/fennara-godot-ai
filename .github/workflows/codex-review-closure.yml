name: Codex review closure validation

on:
  push:
    branches:
      - validation/codex-review-closure-v2
    paths:
      - .github/codex-review-closure.trigger

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/codex-review-closure-v2
          fetch-depth: 0

      - name: Apply review closure changes
        run: |
          python3 .github/scripts/codex_review_closure.py
          python3 .github/scripts/codex_review_docs.py

      - name: Format Rust
        working-directory: local
        run: cargo fmt --all

      - name: Run Rust workspace tests
        working-directory: local
        run: cargo test --workspace

      - name: Run embedded transcript coalescing test
        run: node ui/chat/tests/transcript-renderer-coalescing.test.js

      - name: Validate documentation and patch
        run: |
          grep -q "T3 Code reference assessment" docs/codex-embedded-provider-architecture.md
          grep -q "codex_registration_preserves_existing_provider_registry_and_routing" docs/codex-app-server-ownership.md
          grep -q "pending execution before ready-for-review" docs/codex-windows-manual-acceptance.md
          git diff --check

      - name: Remove one-time validation files
        run: |
          rm -f .github/codex-review-closure.trigger
          rm -f .github/scripts/codex_review_closure.py
          rm -f .github/scripts/codex_review_docs.py
          rm -f .github/workflows/codex-review-closure.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(codex): close review acceptance gaps"
          git push origin HEAD:validation/codex-review-closure-v2
