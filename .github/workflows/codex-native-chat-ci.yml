name: Codex Native Chat CI

on:
  workflow_dispatch:

jobs:
  linux-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          curl -L --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Install official Codex CLI
        run: |
          npm install --global @openai/codex
          codex --version

      - name: Prepare smoke project
        run: |
          mkdir -p tests/codex_native_chat/addons
          cp -R addons/codex_native_chat tests/codex_native_chat/addons/
          chmod +x tests/codex_native_chat/mock_codex.py

      - name: Load addon in the Godot editor
        env:
          CI: "true"
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path tests/codex_native_chat \
            --editor \
            --quit-after 5 2>&1 | tee linux-editor-load.log

      - name: Run GDScript and mock transport smoke tests
        env:
          CI: "true"
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path tests/codex_native_chat \
            --script res://smoke_test.gd 2>&1 | tee linux-smoke-test.log

      - name: Run full dock workflow smoke test
        env:
          CI: "true"
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path tests/codex_native_chat \
            --script res://dock_smoke_test.gd 2>&1 | tee linux-dock-smoke-test.log

      - name: Run approval and elicitation smoke test
        env:
          CI: "true"
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path tests/codex_native_chat \
            --script res://approval_smoke_test.gd 2>&1 | tee linux-approval-smoke-test.log

      - name: Run login and control workflow smoke test
        env:
          CI: "true"
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path tests/codex_native_chat \
            --script res://controls_smoke_test.gd 2>&1 | tee linux-controls-smoke-test.log

      - name: Run official Codex app-server smoke test
        env:
          CI: "true"
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path tests/codex_native_chat \
            --script res://official_codex_smoke_test.gd 2>&1 | tee linux-official-codex.log

      - name: Upload Linux logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-native-chat-linux-logs
          path: |
            linux-editor-load.log
            linux-smoke-test.log
            linux-dock-smoke-test.log
            linux-approval-smoke-test.log
            linux-controls-smoke-test.log
            linux-official-codex.log
          if-no-files-found: ignore

  windows-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python
        shell: pwsh
        run: python --version

      - name: Install Godot 4.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip" `
            -OutFile "godot.zip"
          Expand-Archive -Path "godot.zip" -DestinationPath "." -Force

      - name: Install official Codex CLI
        shell: pwsh
        run: |
          npm install --global @openai/codex
          codex --version

      - name: Prepare smoke project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "tests/codex_native_chat/addons" | Out-Null
          Copy-Item -Recurse -Force `
            "addons/codex_native_chat" `
            "tests/codex_native_chat/addons/"

      - name: Load addon in the Godot editor
        shell: pwsh
        env:
          CI: "true"
        run: |
          & .\Godot_v4.6.3-stable_win64.exe `
            --headless `
            --path tests/codex_native_chat `
            --editor `
            --quit-after 5 2>&1 | Tee-Object -FilePath windows-editor-load.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run GDScript and cmd transport smoke tests
        shell: pwsh
        env:
          CI: "true"
        run: |
          & .\Godot_v4.6.3-stable_win64.exe `
            --headless `
            --path tests/codex_native_chat `
            --script res://smoke_test.gd 2>&1 | Tee-Object -FilePath windows-smoke-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full dock workflow smoke test
        shell: pwsh
        env:
          CI: "true"
        run: |
          & .\Godot_v4.6.3-stable_win64.exe `
            --headless `
            --path tests/codex_native_chat `
            --script res://dock_smoke_test.gd 2>&1 | Tee-Object -FilePath windows-dock-smoke-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run approval and elicitation smoke test
        shell: pwsh
        env:
          CI: "true"
        run: |
          & .\Godot_v4.6.3-stable_win64.exe `
            --headless `
            --path tests/codex_native_chat `
            --script res://approval_smoke_test.gd 2>&1 | Tee-Object -FilePath windows-approval-smoke-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run login and control workflow smoke test
        shell: pwsh
        env:
          CI: "true"
        run: |
          & .\Godot_v4.6.3-stable_win64.exe `
            --headless `
            --path tests/codex_native_chat `
            --script res://controls_smoke_test.gd 2>&1 | Tee-Object -FilePath windows-controls-smoke-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run official Codex app-server smoke test
        shell: pwsh
        env:
          CI: "true"
        run: |
          & .\Godot_v4.6.3-stable_win64.exe `
            --headless `
            --path tests/codex_native_chat `
            --script res://official_codex_smoke_test.gd 2>&1 | Tee-Object -FilePath windows-official-codex.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-native-chat-windows-logs
          path: |
            windows-editor-load.log
            windows-smoke-test.log
            windows-dock-smoke-test.log
            windows-approval-smoke-test.log
            windows-controls-smoke-test.log
            windows-official-codex.log
          if-no-files-found: ignore

  package-addon:
    needs:
      - linux-smoke-test
      - windows-smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installable addon archive
        run: |
          mkdir -p dist/addons
          cp -R addons/codex_native_chat dist/addons/
          cd dist
          zip -qr ../codex-native-chat-addon-1.0.0.zip addons
          cd ..
          sha256sum codex-native-chat-addon-1.0.0.zip > codex-native-chat-addon-1.0.0.zip.sha256

      - name: Upload installable addon
        uses: actions/upload-artifact@v4
        with:
          name: codex-native-chat-addon-1.0.0
          path: |
            codex-native-chat-addon-1.0.0.zip
            codex-native-chat-addon-1.0.0.zip.sha256
          if-no-files-found: error
