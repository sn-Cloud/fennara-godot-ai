name: Codex Provider Phase 5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codex-provider-phase5
  cancel-in-progress: false

jobs:
  fake-app-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/codex-embedded-provider
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply phase-five changes
        shell: bash
        run: |
          python .github/scripts/apply_codex_provider_phase5.py
          python .github/scripts/fix_codex_provider_phase5.py

      - name: Format Rust
        working-directory: local
        run: cargo fmt --all

      - name: Test daemon and fake app-server
        working-directory: local
        run: cargo test --locked -p fennara-daemon

      - name: Remove one-time migration files
        shell: bash
        run: |
          rm -f .github/scripts/apply_codex_provider_phase5.py
          rm -f .github/scripts/fix_codex_provider_phase5.py
          rm -f .github/workflows/codex-provider-phase5.yml
          rm -f .github/codex-provider-phase5.trigger

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(codex): exercise fake app-server protocol paths"
          git push origin HEAD:feature/codex-embedded-provider
