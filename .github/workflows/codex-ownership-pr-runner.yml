name: Internal Codex ownership validation

on:
  pull_request:
    branches:
      - feature/codex-embedded-provider
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/codex-ownership-trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'validation/codex-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/codex-ownership
          fetch-depth: 0

      - name: Apply ownership changes
        run: |
          python3 -m py_compile \
            .github/scripts/apply_codex_ownership.py \
            .github/scripts/fix_codex_ownership_escape.py
          python3 .github/scripts/apply_codex_ownership.py
          python3 .github/scripts/fix_codex_ownership_escape.py

      - name: Format Rust changes
        working-directory: local
        run: cargo fmt --all

      - name: Run Codex provider tests
        working-directory: local
        run: cargo test -p fennara-daemon codex_app_server -- --nocapture

      - name: Run full Rust workspace tests
        working-directory: local
        run: cargo test --workspace

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit validated ownership changes
        run: |
          git config user.name "chatgpt-codex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            README.md \
            docs/codex-app-server-ownership.md \
            local/crates/fennara-daemon/src/runtime_daemon/chat/providers/codex_app_server.rs \
            local/crates/fennara-daemon/src/runtime_daemon/chat/providers/codex_app_server/integration_tests.rs
          git commit -m "fix(codex): bind threads to their Codex home"
          git push origin HEAD:validation/codex-ownership
