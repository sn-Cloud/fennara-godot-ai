name: Codex Provider Phase 4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codex-provider-phase4
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/codex-embedded-provider
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply phase-four changes
        run: python .github/scripts/apply_codex_provider_phase4.py

      - name: Format Rust
        working-directory: local
        run: cargo fmt --all

      - name: Test daemon
        working-directory: local
        run: cargo test --locked -p fennara-daemon

      - name: Remove one-time migration files
        shell: bash
        run: |
          rm -f .github/scripts/apply_codex_provider_phase4.py
          rm -f .github/workflows/codex-provider-phase4.yml
          rm -f .github/codex-provider-phase4.trigger

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(codex): harden login and process lifecycle"
          git push origin HEAD:feature/codex-embedded-provider
