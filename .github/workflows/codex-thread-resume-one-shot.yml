name: One-time Codex thread resume validation

on:
  push:
    branches:
      - feature/codex-embedded-provider
    paths:
      - .github/workflows/codex-thread-resume-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply thread ownership acceptance coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          provider = Path("local/crates/fennara-daemon/src/runtime_daemon/chat/providers/codex_app_server.rs")
          replace_once(
              provider,
              '''        .filter(|content| !content.trim().is_empty())
                  .unwrap_or_else(|| prompt_from_messages(messages))''',
              '''        .filter(|content| !content.trim().is_empty())
                  .unwrap_or_default()''',
          )
          replace_once(
              provider,
              '''fn is_missing_thread_error(error: &LlmError) -> bool {
              let message = error.user_message().to_ascii_lowercase();
              message.contains("thread")
                  && (message.contains("not found")
                      || message.contains("does not exist")
                      || message.contains("missing"))
          }''',
              '''fn is_missing_thread_error(error: &LlmError) -> bool {
              let message = error.user_message().to_ascii_lowercase();
              [
                  "thread not found",
                  "thread does not exist",
                  "thread no longer exists",
                  "no thread found",
                  "unknown thread",
              ]
              .iter()
              .any(|pattern| message.contains(pattern))
          }''',
          )

          fixture = Path("local/crates/fennara-daemon/tests/fixtures/fake_codex_app_server.py")
          replace_once(
              fixture,
              '''        self.active_thread_id: str | None = None
                  self.pending_server_requests: dict[str, str] = {}
          
              def initialize_result(self) -> dict[str, Any]:''',
              '''        self.active_thread_id: str | None = None
                  self.pending_server_requests: dict[str, str] = {}
                  self.codex_home = Path(
                      os.environ.get("CODEX_HOME", str(Path.home() / ".codex"))
                  )
                  self.state_path = self.codex_home / "fake-thread-state.json"
                  self.request_log_path = self.codex_home / "fake-request-log.jsonl"
                  self.load_state()
          
              def load_state(self) -> None:
                  if not self.state_path.is_file():
                      return
                  raw = json.loads(self.state_path.read_text(encoding="utf-8"))
                  threads = raw.get("threads")
                  if isinstance(threads, dict):
                      self.scenario.threads = threads
          
              def save_state(self) -> None:
                  self.codex_home.mkdir(parents=True, exist_ok=True)
                  temporary = self.state_path.with_suffix(".tmp")
                  temporary.write_text(
                      json.dumps({"threads": self.scenario.threads}, separators=(",", ":")),
                      encoding="utf-8",
                  )
                  temporary.replace(self.state_path)
          
              def log_client_request(self, method: str, params: dict[str, Any]) -> None:
                  self.codex_home.mkdir(parents=True, exist_ok=True)
                  with self.request_log_path.open("a", encoding="utf-8") as log:
                      log.write(
                          json.dumps(
                              {"method": method, "params": params},
                              separators=(",", ":"),
                          )
                          + "\\n"
                      )
          
              def initialize_result(self) -> dict[str, Any]:''',
          )
          replace_once(
              fixture,
              '''        params = message.get("params") or {}
          
                  if method is None and message_id in self.pending_server_requests:''',
              '''        params = message.get("params") or {}
          
                  if method is not None:
                      self.log_client_request(str(method), params)
          
                  if method is None and message_id in self.pending_server_requests:''',
          )
          replace_once(
              fixture,
              '''            self.active_thread_id = thread_id
                      self.scenario.threads[thread_id] = {"turns": 0, "compacted": False}
                      response(message_id, self.thread_result(thread_id, params))''',
              '''            self.active_thread_id = thread_id
                      self.scenario.threads[thread_id] = {"turns": 0, "compacted": False}
                      self.save_state()
                      response(message_id, self.thread_result(thread_id, params))''',
          )
          replace_once(
              fixture,
              '''            if self.scenario.thread_resume == "permission-denied":
                          error(message_id, "Permission denied while opening thread")
                          return
                      self.active_thread_id = thread_id
                      self.scenario.threads.setdefault(thread_id, {"turns": 0, "compacted": False})
                      response(message_id, self.thread_result(thread_id, params))''',
              '''            if self.scenario.thread_resume == "permission-denied":
                          error(message_id, "Permission denied while opening thread")
                          return
                      if thread_id not in self.scenario.threads:
                          error(message_id, "Thread does not exist")
                          return
                      self.active_thread_id = thread_id
                      response(message_id, self.thread_result(thread_id, params))''',
          )
          replace_once(
              fixture,
              '''            if not thread_id:
                          error(message_id, "threadId is required", -32602)
                          return
                      turn_id = f"turn-{uuid.uuid4()}"''',
              '''            if not thread_id:
                          error(message_id, "threadId is required", -32602)
                          return
                      if thread_id not in self.scenario.threads:
                          error(message_id, "Thread does not exist")
                          return
                      turn_id = f"turn-{uuid.uuid4()}"''',
          )
          replace_once(
              fixture,
              '''            notification("thread/compaction/completed", {"threadId": thread_id})
                      self.scenario.threads[thread_id]["compacted"] = True''',
              '''            notification("thread/compaction/completed", {"threadId": thread_id})
                      self.scenario.threads[thread_id]["compacted"] = True
                      self.save_state()''',
          )
          replace_once(
              fixture,
              '''        self.scenario.threads[thread_id]["turns"] += 1
                  notification(''',
              '''        self.scenario.threads[thread_id]["turns"] += 1
                  self.save_state()
                  notification(''',
          )

          tests = Path("local/crates/fennara-daemon/src/runtime_daemon/chat/providers/codex_app_server/integration_tests.rs")
          replace_once(
              tests,
              '''    let executable = write_fixture_launcher(&root, scenario, &fixture);
              FixtureRuntime {
                  root,
                  spec: codex_runtime::CodexRuntimeSpec {
                      executable,
                      source: codex_runtime::CodexRuntimeSource::Configured,
                      platform: test_platform(),
                      codex_home: None,
                  },
              }''',
              '''    let executable = write_fixture_launcher(&root, scenario, &fixture);
              let codex_home = root.join("codex-home");
              fs::create_dir_all(&codex_home).expect("create fixture CODEX_HOME");
              FixtureRuntime {
                  root,
                  spec: codex_runtime::CodexRuntimeSpec {
                      executable,
                      source: codex_runtime::CodexRuntimeSource::Configured,
                      platform: test_platform(),
                      codex_home: Some(codex_home),
                  },
              }''',
          )
          replace_once(
              tests,
              '''async fn start_turn(connection: &mut CodexConnection, thread_id: &str) {
              connection
                  .request(
                      "turn/start",
                      json!({
                          "threadId": thread_id,
                          "input": [{ "type": "text", "text": "test turn" }]
                      }),
                      TEST_TIMEOUT,
                  )
                  .await
                  .expect("turn/start failed");
          }
          
          #[derive(Clone, Debug)]''',
              '''async fn start_turn_with_text(
              connection: &mut CodexConnection,
              thread_id: &str,
              text: &str,
          ) {
              connection
                  .request(
                      "turn/start",
                      json!({
                          "threadId": thread_id,
                          "input": [{ "type": "text", "text": text }]
                      }),
                      TEST_TIMEOUT,
                  )
                  .await
                  .expect("turn/start failed");
          }
          
          async fn start_turn(connection: &mut CodexConnection, thread_id: &str) {
              start_turn_with_text(connection, thread_id, "test turn").await;
          }
          
          fn fixture_request_log(fixture: &FixtureRuntime) -> Vec<Value> {
              let path = fixture
                  .root
                  .join("codex-home")
                  .join("fake-request-log.jsonl");
              let Ok(raw) = fs::read_to_string(path) else {
                  return Vec::new();
              };
              raw.lines()
                  .filter_map(|line| serde_json::from_str::<Value>(line).ok())
                  .collect()
          }
          
          #[derive(Clone, Debug)]''',
          )
          replace_once(
              tests,
              '''async fn missing_thread_resume_is_classified_without_history_replay() {
              let (_fixture, mut connection) = spawn_fixture("resume-missing", None).await;
              let error = connection
                  .request(
                      "thread/resume",
                      json!({ "threadId": "missing-thread" }),
                      TEST_TIMEOUT,
                  )
                  .await
                  .expect_err("missing thread should fail");
              assert!(is_missing_thread_error(&error));
              connection.shutdown().await;
          }
          
          async fn assert_approval_round_trip(''',
              '''async fn missing_thread_resume_is_classified_without_history_replay() {
              let (fixture, mut connection) = spawn_fixture("resume-missing", None).await;
              let error = connection
                  .request(
                      "thread/resume",
                      json!({ "threadId": "missing-thread" }),
                      TEST_TIMEOUT,
                  )
                  .await
                  .expect_err("missing thread should fail");
              assert!(is_missing_thread_error(&error));
              connection.shutdown().await;
          
              let requests = fixture_request_log(&fixture);
              assert!(requests.iter().any(|request| {
                  request.get("method").and_then(Value::as_str) == Some("thread/resume")
              }));
              assert!(!requests.iter().any(|request| {
                  matches!(
                      request.get("method").and_then(Value::as_str),
                      Some("thread/start" | "turn/start")
                  )
              }));
          }
          
          #[tokio::test]
          async fn non_missing_resume_error_is_not_reclassified() {
              let (_fixture, mut connection) =
                  spawn_fixture("resume-permission-denied", None).await;
              let error = connection
                  .request(
                      "thread/resume",
                      json!({ "threadId": "existing-thread" }),
                      TEST_TIMEOUT,
                  )
                  .await
                  .expect_err("permission denied resume should fail");
              assert!(!is_missing_thread_error(&error));
              connection.shutdown().await;
          }
          
          async fn assert_approval_round_trip(''',
          )
          replace_once(
              tests,
              '''async fn compaction_events_do_not_break_thread_completion() {
              let (_fixture, mut connection) = spawn_fixture("compaction", None).await;
              let thread_id = start_thread(&mut connection).await;
              start_turn(&mut connection, &thread_id).await;
              let events = drain_turn(&mut connection).await;
              assert_eq!(events.compaction_started, 1);
              assert_eq!(events.compaction_completed, 1);
              assert!(events.completed);
              connection.shutdown().await;
          }
          
          #[tokio::test]
          async fn multiple_app_server_sessions_are_isolated() {''',
              '''async fn compaction_events_do_not_break_thread_completion() {
              let (_fixture, mut connection) = spawn_fixture("compaction", None).await;
              let thread_id = start_thread(&mut connection).await;
              start_turn(&mut connection, &thread_id).await;
              let events = drain_turn(&mut connection).await;
              assert_eq!(events.compaction_started, 1);
              assert_eq!(events.compaction_completed, 1);
              assert!(events.completed);
              connection.shutdown().await;
          }
          
          #[tokio::test]
          async fn compacted_thread_resumes_after_app_server_restart() {
              let fixture = fixture_runtime("compaction");
              let mut first = timeout(
                  TEST_TIMEOUT,
                  CodexConnection::spawn_runtime(fixture.spec.clone(), None),
              )
              .await
              .expect("first fixture initialize timed out")
              .expect("first fixture initialize failed");
              let thread_id = start_thread(&mut first).await;
              start_turn_with_text(&mut first, &thread_id, "before compaction").await;
              let first_events = drain_turn(&mut first).await;
              assert_eq!(first_events.compaction_completed, 1);
              first.shutdown().await;
          
              let mut restarted = timeout(
                  TEST_TIMEOUT,
                  CodexConnection::spawn_runtime(fixture.spec.clone(), None),
              )
              .await
              .expect("restarted fixture initialize timed out")
              .expect("restarted fixture initialize failed");
              let resumed = restarted
                  .request(
                      "thread/resume",
                      json!({ "threadId": thread_id.clone() }),
                      TEST_TIMEOUT,
                  )
                  .await
                  .expect("thread/resume after restart failed");
              assert_eq!(
                  resumed.pointer("/thread/id").and_then(Value::as_str),
                  Some(thread_id.as_str())
              );
              start_turn_with_text(&mut restarted, &thread_id, "after daemon restart").await;
              let resumed_events = drain_turn(&mut restarted).await;
              assert_eq!(resumed_events.compaction_completed, 1);
              assert!(resumed_events.completed);
              restarted.shutdown().await;
          
              let requests = fixture_request_log(&fixture);
              let turns = requests
                  .iter()
                  .filter(|request| {
                      request.get("method").and_then(Value::as_str) == Some("turn/start")
                  })
                  .collect::<Vec<_>>();
              assert_eq!(turns.len(), 2);
              assert_eq!(
                  turns[1].pointer("/params/input/0/text"),
                  Some(&json!("after daemon restart"))
              );
          }
          
          #[tokio::test]
          async fn resumed_turn_protocol_uses_only_latest_user_input() {
              let messages = vec![
                  json!({ "role": "system", "content": "local system context" }),
                  json!({ "role": "user", "content": "old user input must not replay" }),
                  json!({ "role": "assistant", "content": "old assistant response" }),
                  json!({
                      "role": "user",
                      "content": [{ "type": "text", "text": "latest user input" }]
                  }),
              ];
              let prompt = latest_user_prompt(&messages);
              assert_eq!(prompt, "latest user input");
          
              let fixture = fixture_runtime("authenticated");
              let mut first = timeout(
                  TEST_TIMEOUT,
                  CodexConnection::spawn_runtime(fixture.spec.clone(), None),
              )
              .await
              .expect("first fixture initialize timed out")
              .expect("first fixture initialize failed");
              let thread_id = start_thread(&mut first).await;
              start_turn_with_text(&mut first, &thread_id, "initial remote turn").await;
              drain_turn(&mut first).await;
              first.shutdown().await;
          
              let mut restarted = timeout(
                  TEST_TIMEOUT,
                  CodexConnection::spawn_runtime(fixture.spec.clone(), None),
              )
              .await
              .expect("restarted fixture initialize timed out")
              .expect("restarted fixture initialize failed");
              restarted
                  .request(
                      "thread/resume",
                      json!({ "threadId": thread_id.clone() }),
                      TEST_TIMEOUT,
                  )
                  .await
                  .expect("thread/resume failed");
              start_turn_with_text(&mut restarted, &thread_id, &prompt).await;
              drain_turn(&mut restarted).await;
              restarted.shutdown().await;
          
              let requests = fixture_request_log(&fixture);
              let resumed_turn = requests
                  .iter()
                  .rev()
                  .find(|request| {
                      request.get("method").and_then(Value::as_str) == Some("turn/start")
                  })
                  .expect("resumed turn request");
              assert_eq!(
                  resumed_turn.pointer("/params/input/0/text"),
                  Some(&json!("latest user input"))
              );
              let serialized = resumed_turn.to_string();
              assert!(!serialized.contains("old user input must not replay"));
              assert!(!serialized.contains("old assistant response"));
          }
          
          #[test]
          fn empty_latest_user_input_never_replays_local_history() {
              let messages = vec![
                  json!({ "role": "user", "content": "old user input" }),
                  json!({ "role": "assistant", "content": "old assistant response" }),
                  json!({ "role": "user", "content": "   " }),
              ];
              assert_eq!(latest_user_prompt(&messages), "");
          }
          
          #[test]
          fn provider_session_bindings_survive_reopened_store_connections() {
              let suffix = FIXTURE_COUNTER.fetch_add(1, Ordering::Relaxed);
              let scope = store::ProjectScope {
                  project_path: Some(format!("/tmp/fennara-codex-binding-{suffix}")),
                  project_name: Some(format!("Codex binding {suffix}")),
              };
              let first_chat = store::create_chat(
                  &scope,
                  "codex/gpt-5.5-codex",
                  "medium",
                  &[],
              )
              .expect("create first chat");
              let second_chat = store::create_chat(
                  &scope,
                  "codex/gpt-5.5-codex",
                  "medium",
                  &[],
              )
              .expect("create second chat");
          
              store::upsert_provider_session_binding(
                  &first_chat.chat.id,
                  "codex",
                  "thread-first",
                  "default",
                  Some("0.144.4"),
              )
              .expect("bind first chat");
              store::upsert_provider_session_binding(
                  &second_chat.chat.id,
                  "codex",
                  "thread-second",
                  "default",
                  Some("0.144.4"),
              )
              .expect("bind second chat");
          
              let first = store::provider_session_binding(&first_chat.chat.id, "codex")
                  .expect("read first binding")
                  .expect("first binding");
              let second = store::provider_session_binding(&second_chat.chat.id, "codex")
                  .expect("read second binding")
                  .expect("second binding");
              assert_eq!(first.provider_thread_id, "thread-first");
              assert_eq!(second.provider_thread_id, "thread-second");
          
              store::mark_provider_session_broken(&first_chat.chat.id, "codex")
                  .expect("mark first binding broken");
              let first = store::provider_session_binding(&first_chat.chat.id, "codex")
                  .expect("reopen first binding")
                  .expect("first binding after reopen");
              let second = store::provider_session_binding(&second_chat.chat.id, "codex")
                  .expect("reopen second binding")
                  .expect("second binding after reopen");
              assert_eq!(first.resume_status, "broken");
              assert_eq!(second.resume_status, "ready");
              assert_eq!(second.provider_thread_id, "thread-second");
          }
          
          #[tokio::test]
          async fn multiple_app_server_sessions_are_isolated() {''',
          )
          PY

      - name: Format Rust changes
        working-directory: local
        run: cargo fmt --all

      - name: Run Codex app-server acceptance tests
        working-directory: local
        run: cargo test -p fennara-daemon codex_app_server::integration_tests -- --nocapture

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "chatgpt-codex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            local/crates/fennara-daemon/src/runtime_daemon/chat/providers/codex_app_server.rs \
            local/crates/fennara-daemon/src/runtime_daemon/chat/providers/codex_app_server/integration_tests.rs \
            local/crates/fennara-daemon/tests/fixtures/fake_codex_app_server.py
          git commit -m "test(codex): validate compaction and thread resume"
          git push origin HEAD:feature/codex-embedded-provider
